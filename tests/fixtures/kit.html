<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fam-ui kit fixture</title>
  <link rel="stylesheet" href="../../dist/fam-ui.css">
  <style>
    body { margin: 20px; background: #222; }
    .sample { width: 240px; height: 110px; margin: 0 0 16px; }
  </style>
</head>
<body>
  <div class="fam">
    <div id="felt-green" class="fam-felt" style="--fam-tint:#1f7a3d; width:86px; height:56px; border-radius:10px; margin-bottom:16px"></div>
    <div id="felt-burgundy" class="fam-felt" style="--fam-tint:#8a1f2b; width:86px; height:56px; border-radius:10px; margin-bottom:16px"></div>

    <div id="wood" class="sample fam-wood"></div>
    <div id="metal" class="sample fam-metal"></div>
    <div id="leather" class="sample fam-leather"></div>
    <div id="cardstock" class="sample fam-cardstock"></div>
    <div id="legal-pad" class="sample fam-legal-pad"></div>
    <div id="paper" class="sample fam-paper"></div>
    <div id="frame-tan" class="sample fam-leather-frame"></div>
    <div id="frame-black" class="sample fam-leather-frame fam-leather-frame--black"></div>
  </div>
</body>
</html>
