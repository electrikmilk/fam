<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fam-ui kit fixture</title>
  <link rel="stylesheet" href="../../dist/fam-ui.css">
  <style>
    body { margin: 20px; background: #222; }
    .sample { width: 240px; height: 110px; margin: 0 0 16px; }
  </style>
</head>
<body>
  <div class="fam">
    <div id="felt-green" class="fam-felt" style="--fam-tint:#1f7a3d; width:86px; height:56px; border-radius:10px; margin-bottom:16px"></div>
    <div id="felt-burgundy" class="fam-felt" style="--fam-tint:#8a1f2b; width:86px; height:56px; border-radius:10px; margin-bottom:16px"></div>

    <div id="wood" class="sample fam-wood"></div>
    <div id="metal" class="sample fam-metal"></div>
    <div id="leather" class="sample fam-leather"></div>
    <div id="cardstock" class="sample fam-cardstock"></div>
    <div id="legal-pad" class="sample fam-legal-pad"></div>
    <div id="paper" class="sample fam-paper"></div>
    <div id="cork" class="sample fam-cork"></div>
    <div id="frame-tan" class="sample fam-leather-frame"></div>
    <div id="frame-black" class="sample fam-leather-frame fam-leather-frame--black"></div>
    <div id="bar-tan" class="sample fam-leather-bar"></div>
    <div id="bar-black" class="sample fam-leather-bar fam-leather-bar--black"></div>
    <figure id="wood-frame" class="fam-wood-frame" style="margin:0 0 16px; width:240px"><button id="wood-frame-content" type="button" style="display:block; width:100%; height:80px">Open</button></figure>
    <figure id="print-paper" class="fam-print-frame fam-paper" style="margin:0 0 16px; width:240px"><div style="height:80px"></div></figure>
    <figure id="print-cardstock" class="fam-print-frame fam-cardstock" style="margin:0 0 16px; width:240px"><div style="height:80px"></div></figure>
    <figure id="wood-frame-glossy"class="fam-wood-frame fam-wood-frame--glossy" style="margin:0 0 16px; width:240px"><div style="height:80px"></div></figure>

    <div id="glass" class="fam-glass" style="--fam-r:27px; width:210px; height:54px; margin-bottom:16px"></div>
    <div id="glass-light" class="fam-glass fam-glass--light" style="--fam-r:27px; width:210px; height:54px; margin-bottom:16px"></div>
    <div id="glass-blue" class="fam-glass fam-glass--blue" style="--fam-r:27px; width:210px; height:54px; margin-bottom:16px"></div>
    <div id="glass-rounded" class="fam-glass fam-round-md" style="width:210px; height:54px; margin-bottom:16px"></div>
    <div id="glass-saturated"class="fam-glass" style="--fam-glass-saturate:200%; width:210px; height:54px; margin-bottom:16px"></div>
    <div id="glass-refract" class="fam-glass fam-glass--refract" style="--fam-r:27px; width:210px; height:54px; margin-bottom:16px"></div>
    <div id="glass-blurred" class="fam-glass" style="--fam-glass-blur:20px; width:210px; height:54px; margin-bottom:16px"></div>
    <div id="refract-blurred" class="fam-glass fam-glass--refract" style="--fam-refract-blur:6px; width:210px; height:54px; margin-bottom:16px"></div>

    <span id="engraved-metal" class="fam-engraved-metal">SETTINGS</span>
    <span id="engraved-wood" class="fam-engraved-wood">LIBRARY</span>
    <span id="engraved-leather" class="fam-engraved-leather">Notebook</span>

    <div style="--fam-outer-radius:34px; --fam-pad:16px; padding:16px; border-radius:34px; width:200px; margin:16px 0"><div id="concentric" class="fam-concentric" style="height:40px"></div></div>

    <div id="shadow-sm" class="fam-shadow-sm" style="width:60px; height:40px; margin:10px"></div>
    <div id="shadow-md" class="fam-shadow-md" style="width:60px; height:40px; margin:10px"></div>
    <div id="shadow-lg" class="fam-shadow-lg" style="width:60px; height:40px; margin:10px"></div>
    <div id="shadow-inset" class="fam-shadow-inset" style="width:60px; height:40px; margin:10px"></div>

    <div id="pill-none" class="fam-pill fam-gloss-none" style="width:150px; height:46px; margin:10px"></div>
    <div id="pill-soft" class="fam-pill fam-gloss-soft" style="width:150px; height:46px; margin:10px"></div>
    <div id="pill-strong" class="fam-pill fam-gloss-strong" style="width:150px; height:46px; margin:10px"></div>

    <section id="components" class="fam-felt" style="padding:20px; margin-top:24px; width:520px">
      <nav id="nav" class="fam-nav fam-wood" aria-label="Sample">
        <span class="fam-nav-brand">fam-ui</span>
        <a id="nav-current" class="fam-nav-item" href="#controls" aria-current="page">Controls</a>
        <a id="nav-link" class="fam-nav-item" href="#progress">Progress</a>
      </nav>

      <div class="fam-glass" style="margin:16px 0"><input id="glass-input" class="fam-glass-input" placeholder="Search" aria-label="Search"></div>
      <div class="fam-glass" style="margin:16px 0"><select id="glass-select" class="fam-glass-input" aria-label="Wood"><option>Walnut</option><option>Oak</option></select></div>
      <ul id="menu" class="fam-menu" role="listbox" aria-label="Sample options">
        <li role="option">Oak</li>
        <li id="menu-selected" role="option" aria-selected="true">Walnut</li>
      </ul>

      <p>
        <label id="switch-on" class="fam-switch"><input type="checkbox" role="switch" aria-label="Wi-Fi" checked><span class="fam-switch-knob"></span></label>
        <label id="switch-off" class="fam-switch"><input type="checkbox" role="switch" aria-label="Bluetooth"><span class="fam-switch-knob"></span></label>
        <span id="led-lit" class="fam-led fam-led--lit"><span class="fam-led-lens" aria-hidden="true"></span><span class="fam-led-label">Power</span><span class="fam-visually-hidden">, on</span></span>
        <span id="led-unlit" class="fam-led"><span class="fam-led-lens" aria-hidden="true"></span><span class="fam-led-label">Standby</span><span class="fam-visually-hidden">, off</span></span>
        <label id="led-toggle" class="fam-led"><input type="checkbox" role="switch"><span class="fam-led-lens"></span><span class="fam-led-label">Toggle</span></label>
        <label id="led-toggle-disabled" class="fam-led"><input type="checkbox" role="switch" disabled><span class="fam-led-lens"></span><span class="fam-led-label">Locked</span></label>
      </p>

      <div class="fam-progress" role="progressbar" aria-label="Candy" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100" style="--fam-value:68%; margin-bottom:14px"><div id="candy" class="fam-progress-fill fam-progress-fill--candy"></div></div>
      <div class="fam-progress" role="progressbar" aria-label="Aqua" aria-valuenow="52" aria-valuemin="0" aria-valuemax="100" style="--fam-value:52%; margin-bottom:14px"><div class="fam-progress-fill fam-progress-fill--aqua"></div></div>
      <div class="fam-progress" role="progressbar" aria-label="Green" aria-valuenow="84" aria-valuemin="0" aria-valuemax="100" style="--fam-value:84%; margin-bottom:14px"><div class="fam-progress-fill fam-progress-fill--green"></div></div>

      <p>
        <button id="plastic-red" class="fam-plastic fam-plastic--red" type="button">Record</button>
        <button id="plastic-green" class="fam-plastic fam-plastic--green" type="button">Play</button>
        <button id="plastic-amber" class="fam-plastic fam-plastic--amber" type="button">Pause</button>
        <button id="plastic-blue" class="fam-plastic fam-plastic--blue" type="button">Share</button>
        <button id="plastic-purple" class="fam-plastic fam-plastic--purple fam-plastic--round" type="button" aria-label="Info">i</button>
        <button id="plastic-square" class="fam-plastic fam-plastic--blue fam-plastic--square" type="button" aria-label="Eject">E</button>
        <span id="knob" class="fam-knob" role="img" aria-label="Metal knob"></span>
      </p>
    </section>

    <section id="paper-components" class="fam-paper" style="padding:20px; margin-top:24px; width:320px">
      <label class="fam-search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg><input id="search-input" placeholder="Search" aria-label="Search notes"></label>
      <ul class="fam-list" style="margin-top:12px">
        <li><a id="row-plain" class="fam-list-row" href="#grocery"><b>Grocery run</b><span>Today</span></a></li>
        <li><a id="row-selected" class="fam-list-row" href="#picnic" aria-current="true"><b>Picnic plans</b><span>Yesterday</span></a></li>
      </ul>
    </section>

    <section id="tan-components" class="fam-leather" style="padding:20px; margin-top:24px; width:360px">
      <div id="recessed" class="fam-recessed">
        <div class="fam-recessed-row"><label for="recessed-input">Apple ID</label><input id="recessed-input" placeholder="example@me.com"></div>
      </div>
      <button id="leather-button" class="fam-leather-button" type="button">Sign In</button>
    </section>

    <section id="plate" class="fam-metal" style="padding:20px; margin-top:24px; width:360px">
      <button id="plastic-on-metal" class="fam-plastic fam-plastic--blue" type="button">Share</button>
      <button id="metal-button" class="fam-metal-button" type="button">Eject</button>
      <button id="glossy-button" class="fam-glossy-button" type="button">Save</button>
      <button id="glossy-silver" class="fam-glossy-button fam-glossy-button--silver" type="button">Cancel</button>
      <label id="switch-on-metal" class="fam-switch"><input type="checkbox" role="switch" aria-label="On metal"><span class="fam-switch-knob"></span></label>
    </section>

    <section id="groups" class="fam-metal" style="padding:20px; margin-top:24px; width:360px">
      <div id="group-plastic" class="fam-button-group" role="group" aria-label="Transport">
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Rewind">R</button>
        <button id="group-unpressed" class="fam-plastic fam-plastic--square" type="button" aria-label="Play" aria-pressed="false">P</button>
        <button id="group-pressed" class="fam-plastic fam-plastic--square" type="button" aria-label="Record" aria-pressed="true">C</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Forward">F</button>
      </div>
      <div id="group-metal" class="fam-button-group" role="group" aria-label="Views">
        <button class="fam-metal-button" type="button">One</button>
        <button id="group-metal-lit" class="fam-metal-button" type="button" aria-pressed="true">Two</button>
        <button class="fam-metal-button" type="button">Three</button>
      </div>
      <div id="group-glossy" class="fam-button-group" role="group" aria-label="Toolbar">
        <button id="group-glossy-plain" class="fam-glossy-button fam-glossy-button--silver" type="button">Back</button>
        <button id="group-glossy-lit" class="fam-glossy-button fam-glossy-button--silver" type="button" aria-pressed="true">List</button>
        <button class="fam-glossy-button fam-glossy-button--silver" type="button">Forward</button>
      </div>
      <div id="group-selected-wrap" class="fam-button-group" role="tablist" aria-label="Tabs">
        <button class="fam-plastic fam-plastic--square" type="button" role="tab" aria-selected="false">A</button>
        <button id="group-selected" class="fam-plastic fam-plastic--square" type="button" role="tab" aria-selected="true">B</button>
      </div>
    </section>

    <section id="radios-metal" class="fam-metal" style="padding:20px; margin-top:24px; width:360px">
      <label class="fam-radio fam-radio--plastic"><input type="radio" name="mode" aria-label="Plastic on" checked><span id="radio-plastic-on" class="fam-radio-dot"></span>On</label>
      <label class="fam-radio fam-radio--plastic"><input type="radio" name="mode" aria-label="Plastic off"><span id="radio-plastic-off" class="fam-radio-dot"></span>Off</label>
      <label class="fam-radio fam-radio--metal"><input type="radio" name="metal" aria-label="Metal on" checked><span id="radio-metal-on" class="fam-radio-dot"></span>On</label>
      <label class="fam-radio fam-radio--glossy"><input type="radio" name="glossy" aria-label="Glossy on" checked><span id="radio-glossy-on" class="fam-radio-dot"></span>On</label>
      <span id="speed-start" tabindex="0">start</span>
      <label class="fam-radio fam-radio--plastic"><input id="speed-1" type="radio" name="speed" checked><span class="fam-radio-dot"></span>Slow</label>
      <label class="fam-radio fam-radio--plastic"><input id="speed-2" type="radio" name="speed"><span class="fam-radio-dot"></span>Medium</label>
      <label class="fam-radio fam-radio--plastic"><input id="speed-3" type="radio" name="speed"><span class="fam-radio-dot"></span>Fast</label>
    </section>

    <section id="radios-glass" class="fam-felt" style="padding:20px; margin-top:24px; width:360px">
      <label class="fam-radio fam-radio--glass"><input id="radio-glass-input" type="radio" name="glass" aria-label="Glass on" checked><span id="radio-glass-on" class="fam-radio-dot"></span>On</label>
    </section>

    <section id="tabs-silver-section" class="fam-paper" style="padding:20px; margin-top:24px; width:360px">
      <div id="tabs-silver" class="fam-button-group" role="tablist" aria-label="Silver tabs">
        <button id="tab-silver-plain" class="fam-glossy-button fam-glossy-button--silver" type="button" role="tab" aria-selected="false">Tab</button>
        <button id="tab-silver-selected" class="fam-glossy-button fam-glossy-button--silver" type="button" role="tab" aria-selected="true">View</button>
        <button id="tab-silver-disabled" class="fam-glossy-button fam-glossy-button--silver" type="button" role="tab" aria-selected="false" disabled>Locked</button>
        <button id="tab-silver-last" class="fam-glossy-button fam-glossy-button--silver" type="button" role="tab" aria-selected="false">More</button>
      </div>
    </section>

    <section id="tabs-materials" class="fam-metal" style="padding:20px; margin-top:24px; width:360px">
      <div id="tabs-plastic" class="fam-button-group fam-button-group--case" role="tablist" aria-label="Plastic tabs">
        <button id="tab-plastic-plain" class="fam-plastic fam-plastic--cream" type="button" role="tab" aria-selected="false">General</button>
        <button id="tab-plastic-selected" class="fam-plastic fam-plastic--cream" type="button" role="tab" aria-selected="true">Sound</button>
      </div>
      <div id="tabs-metal" class="fam-button-group" role="tablist" aria-label="Metal tabs">
        <button id="tab-metal-plain" class="fam-metal-button" type="button" role="tab" aria-selected="false">One</button>
        <button id="tab-metal-selected" class="fam-metal-button" type="button" role="tab" aria-selected="true">Two</button>
      </div>
    </section>

    <section id="tabs-wood-leather" class="fam-felt" style="padding:20px; margin-top:24px; width:360px">
      <div id="tabs-wood" class="fam-wood fam-button-group fam-button-group--wood" role="tablist" aria-label="Wood tabs">
        <button id="tab-wood-plain" class="fam-nav-item" type="button" role="tab" aria-selected="false">Library</button>
        <button id="tab-wood-selected" class="fam-nav-item" type="button" role="tab" aria-selected="true">Shelf</button>
        <button id="tab-wood-disabled" class="fam-nav-item" type="button" role="tab" aria-selected="false" disabled>Locked</button>
      </div>
      <div id="tabs-leather" class="fam-button-group fam-button-group--leather" role="tablist" aria-label="Leather tabs">
        <button id="tab-leather-plain" class="fam-leather-button" type="button" role="tab" aria-selected="false">Name</button>
        <button id="tab-leather-selected" class="fam-leather-button" type="button" role="tab" aria-selected="true">Date</button>
      </div>
    </section>

    <section id="tabs-on-leather" class="fam-leather" style="padding:20px; margin-top:24px; width:360px">
      <div id="tabs-leather-on-leather" class="fam-button-group fam-button-group--leather" role="tablist" aria-label="Leather on leather">
        <button id="tab-lol-plain" class="fam-leather-button" type="button" role="tab" aria-selected="false">Notes</button>
        <button id="tab-lol-selected" class="fam-leather-button" type="button" role="tab" aria-selected="true">Todo</button>
      </div>
    </section>

    <section id="plastic-grain" class="fam-metal" style="padding:20px; margin-top:24px; width:360px">
      <label class="fam-radio fam-radio--plastic"><input type="radio" name="grain"><span id="grain-radio" class="fam-radio-dot"></span>Grain</label>
    </section>

    <section id="plastic-panel" class="fam-plastic-panel fam-round-md" style="padding:20px; margin-top:24px; width:360px">
      <span id="dial" class="fam-dial" role="img" aria-label="Volume 5"></span>
      <span id="dial-low" class="fam-dial" role="img" aria-label="Volume 1" style="--fam-knob-angle:-100deg"></span>
      <button id="plastic-on-panel" class="fam-plastic fam-plastic--blue" type="button">Share</button>
    </section>

    <nav id="nav-metal" class="fam-nav fam-metal" aria-label="Metal navigation" style="margin-top:24px; width:360px">
      <span class="fam-nav-brand">Brand</span>
      <a id="nav-metal-plain" class="fam-nav-item" href="#plain">Plain</a>
      <a id="nav-metal-current" class="fam-nav-item" href="#current" aria-current="page">Current</a>
    </nav>

    <section id="groups-leather" class="fam-felt" style="padding:20px; margin-top:24px; width:360px">
      <div id="group-leather" class="fam-button-group fam-button-group--leather" role="group" aria-label="Sort">
        <button id="group-leather-plain" class="fam-leather-button" type="button">Name</button>
        <button id="group-leather-lit" class="fam-leather-button" type="button" aria-pressed="true">Date</button>
      </div>
    </section>

    <section id="groups-long" class="fam-metal" style="padding:20px; margin-top:24px; width:300px">
      <div id="group-long" class="fam-button-group" role="group" aria-label="Long">
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 1">1</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 2">2</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 3">3</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 4">4</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 5">5</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 6">6</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 7">7</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 8">8</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 9">9</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 10">10</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 11">11</button>
        <button class="fam-plastic fam-plastic--square" type="button" aria-label="Cell 12">12</button>
      </div>
    </section>

    <section id="glass-buttons" class="fam-felt" style="padding:20px; margin-top:24px; width:360px">
      <button id="glass-button" class="fam-glass fam-glass-button" type="button">Share</button>
      <button id="glass-button-light" class="fam-glass fam-glass--light fam-glass-button" type="button">Send</button>
      <button id="glass-button-blue" class="fam-glass fam-glass--blue fam-glass-button" type="button">Save</button>
    </section>

    <section id="metal-buttons" class="fam-felt" style="padding:20px; margin-top:24px; width:360px">
      <button id="metal-button-on-felt" class="fam-metal-button" type="button">Eject</button>
      <button id="metal-round" class="fam-metal-button fam-metal-button--round" type="button" aria-label="Info">i</button>
      <button id="metal-square" class="fam-metal-button fam-metal-button--square" type="button" aria-label="Eject">E</button>
    </section>

    <section id="disabled" class="fam-felt" style="padding:20px; margin-top:24px; width:360px">
      <button id="metal-button-disabled" class="fam-metal-button" type="button" disabled>Eject</button>
      <label id="radio-plastic-disabled-label" class="fam-radio fam-radio--plastic"><input id="radio-plastic-disabled" type="radio" name="locked" aria-label="Locked" disabled><span class="fam-radio-dot"></span>Locked</label>
      <button id="glossy-disabled" class="fam-glossy-button" type="button" disabled>Save</button>
      <div class="fam-button-group" role="group" aria-label="Locked"><button id="group-disabled-pressed" class="fam-plastic fam-plastic--square" type="button" aria-label="Locked record" aria-pressed="true" disabled>C</button></div>
      <button id="glass-button-disabled" class="fam-glass fam-glass-button" type="button" disabled>Share</button>
      <button id="plastic-disabled" class="fam-plastic fam-plastic--red" type="button" disabled>Record</button>
      <button id="plastic-round-disabled" class="fam-plastic fam-plastic--red fam-plastic--round" type="button" aria-label="Locked info" disabled>i</button>
      <button id="plastic-square-disabled" class="fam-plastic fam-plastic--red fam-plastic--square" type="button" aria-label="Locked eject" disabled>E</button>
      <button id="leather-disabled" class="fam-leather-button" type="button" disabled>Sign In</button>
      <label id="switch-disabled" class="fam-switch"><input type="checkbox" role="switch" aria-label="Locked" disabled><span class="fam-switch-knob"></span></label>
      <div id="glass-disabled" class="fam-glass"><input class="fam-glass-input" aria-label="Locked field" value="Locked" disabled></div>
    </section>

    <div id="stitched" class="fam-stitched" style="--fam-leather-color:#8a5a30; width:300px; height:140px; margin-top:24px; background:#8a5a30"></div>
  </div>
</body>
</html>
