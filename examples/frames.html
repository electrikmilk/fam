<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fam-ui frames</title>
  <link rel="stylesheet" href="../dist/fam-ui.css">
  <style>
    body { margin: 0; padding: 28px 16px; background: #1b1b1f; }
    .fam { max-width: 900px; margin: 0 auto; }
    .fam .page-heading { margin: 34px 0 20px; font-size: 15px; font-weight: 600; color: #e9e9ec; }
    .fam .page-heading:first-child { margin-top: 0; }
    .frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px; align-items: start; }
    .frames figure { margin: 0; }
    .board { height: 280px; }
  </style>
</head>
<body>
<div class="fam">
  <main>
    <h1 class="page-heading">Photo frames</h1>
    <div class="frames">
      <figure class="fam-print-frame fam-paper"><img src="tree.jpg" alt="A lone tree on a green hill under a cloudy sky"></figure>
      <figure class="fam-print-frame fam-cardstock"><img src="tree.jpg" alt="A lone tree on a green hill under a cloudy sky"></figure>
      <figure class="fam-wood-frame"><img src="tree.jpg" alt="A lone tree on a green hill under a cloudy sky"></figure>
      <figure class="fam-wood-frame fam-wood-frame--glossy"><img src="tree.jpg" alt="A lone tree on a green hill under a cloudy sky"></figure>
    </div>

    <h2 class="page-heading">Corkboard in a wood frame</h2>
    <div class="fam-wood-frame">
      <div class="board fam-cork"></div>
    </div>
  </main>
</div>
</body>
</html>
