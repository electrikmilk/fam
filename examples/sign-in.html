<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fam-ui sign-in card</title>
  <link rel="stylesheet" href="../dist/fam-ui.css">
  <style>
    body { margin: 0; padding: 28px 16px; background: #1b1b1f; }
    .fam { max-width: 900px; margin: 0 auto; }
    .fam .page-heading { margin: 34px 0 6px; font-size: 15px; font-weight: 600; color: #e9e9ec; }
    .fam p.note { margin: 0 0 14px; font-size: 12px; color: #c9c9d0; }
  </style>
</head>
<body>
<div class="fam">
  <main class="fam-signin fam-leather-frame">
    <h1 class="fam-signin-title">Sign In</h1>
    <div class="fam-field fam-field--group">
      <div class="fam-field-row"><label for="signin-id">Email</label><input id="signin-id" placeholder="me@example.com" autocomplete="username"></div>
      <div class="fam-field-row"><label for="signin-password">Password</label><input id="signin-password" type="password" placeholder="Required" autocomplete="current-password"></div>
    </div>
    <button class="fam-leather-button" type="button">Sign In</button>
  </main>
</div>
</body>
</html>
